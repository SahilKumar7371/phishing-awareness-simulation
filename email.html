<!DOCTYPE html>
<html>
<head>
    <title>Security Alert</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
            padding:40px;
        }

        .email-box{
            background:white;
            max-width:700px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        .btn{
            display:inline-block;
            background:#1a73e8;
            color:white;
            padding:12px 20px;
            text-decoration:none;
            border-radius:5px;
            margin-top:15px;
        }
    </style>
</head>
<body>

<div class="email-box">
    <h2>Google Security Alert</h2>

    <p>Dear User,</p>

    <p>
        We detected unusual activity on your account.
        To prevent account suspension, please verify your account immediately.
    </p>

    <a href="index.html" class="btn">Verify Account</a>

    <p style="margin-top:20px;">
        Thank You,<br>
        Google Security Team
    </p>

    <hr>

    <p style="color:red;">
        Educational Cybersecurity Awareness Simulation Only
    </p>
</div>

</body>
</html>
